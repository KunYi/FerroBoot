[package]
name = "boot-rescue"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Pure helpers for the UART rescue protocol (slot argument, write range, slot erase), host-testable"

[dependencies]
boot-layout = { workspace = true }
boot-flash = { workspace = true }

[dev-dependencies]
boot-flash = { workspace = true, features = ["std"] }
boot-nor = { workspace = true, features = ["std"] }
boot-abi = { workspace = true }
